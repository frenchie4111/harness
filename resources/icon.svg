<!--
  Ness app icon — master artwork. Every raster icon in the repo is generated
  from this file by scripts/build-icons.sh; edit here, never the PNGs.

  The three paths are the approved mark, in its own 64-unit space: two
  deliberately unequal humps joined at the waterline, then a hooked neck with a
  blunt snout, facing right. Their bounding box is x 7.6-56.8, y 10.4-38, so the
  group transform below centres that box on the 1024 canvas rather than centring
  the 64-unit viewBox (which would sit the creature low and left).
-->
